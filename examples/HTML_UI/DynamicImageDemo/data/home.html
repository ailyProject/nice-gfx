<main id="home" style="width:100%;height:100%;padding:24px;gap:12px">
  <p id="title">Device image updates</p>
  <gfx-media id="photo" data-media="demo-checker" data-media-dynamic="true" style="width:100%;height:240px"></gfx-media>
  <p id="status">Authored fallback</p>
  <div style="flex-direction:row;gap:8px;height:44px">
    <button id="dynamic" data-on-click="startDynamic" style="width:50%">Generate</button>
    <button id="resource" data-on-click="switchResource" style="width:50%">Resource</button>
  </div>
  <div style="flex-direction:row;gap:8px;height:44px">
    <button id="clear" data-on-click="clearPhoto" style="width:50%">Clear</button>
    <button id="reset" data-on-click="resetPhoto" style="width:50%">Reset</button>
  </div>
</main>
